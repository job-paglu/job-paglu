</head>
<body>
  <a class="skip-link" href="#links">Skip to links</a>

  <div class="page">
    <!-- Profile Header -->
    <header class="profile" aria-label="Profile">
      <div class="avatar-wrap">
        <img
          id="avatar"
          class="avatar"
          src="assets/placeholder-avatar.svg"
          alt=""
          width="112"
          height="112"
          loading="eager"
          decoding="async"
        />
      </div>
      <h1 id="display-name" class="name"></h1>
      <a
        class="handle"
        href="https://instagram.com/job_paglu_"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="@job_paglu_ on Instagram"
        >@job_paglu_</a
      >
      <p id="bio" class="bio"></p>
    </header>

    <!-- Premium Search Bar (HERO of the page) -->
    <section class="search-section" id="search-section" aria-label="Search jobs">
      <div class="search-section-label">
        <svg class="search-section-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="search-section-text">Find Your Next Job</span>
      </div>
      <div class="search-bar-wrap">
        <div class="search-bar-inner">
          <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search jobs, companies, roles, categories..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Search jobs"
          />
          <button id="search-btn" class="search-btn" type="button" aria-label="Search">
            <span class="search-btn-text">Search</span>
            <svg class="search-btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>
      <div class="search-hint">Press Enter or click Search</div>
    </section>

    <!-- 3-Column Layout: Left Ad | Center Content | Right Ad -->
    <div class="content-layout" id="content-layout">

      <!-- Left Sidebar Ad (shown only on search results, desktop) -->
      <aside class="sidebar sidebar-left" id="sidebar-left" aria-label="Advertisement" hidden>
        <div class="sidebar-ad-slot" id="sidebar-ad-left">
          <div class="ad-label">Ad</div>
          <div class="sidebar-ad-container">
            <ins class="adsbygoogle"
              style="display:block"
              data-ad-client="ca-pub-3043505043619574"
              data-ad-slot=""
              data-ad-format="vertical"
              data-full-width-responsive="true"></ins>
          </div>
        </div>
      </aside>

      <!-- Center Content Area -->
      <div class="content-center" id="content-center">

        <!-- Search Results (hidden by default) -->
        <div id="search-results" class="search-results" hidden>
          <div class="search-results-header">
            <h2 id="search-results-title" class="search-results-title"></h2>
            <button id="search-clear-btn" class="search-clear-btn" aria-label="Clear search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span class="clear-btn-text">Clear</span>
            </button>
          </div>
          <ul id="search-results-list" class="links-list"></ul>
          <p id="search-empty-state" class="empty-state" hidden>
            No jobs found. Try different keywords.
          </p>
        </div>

        <!-- Main Links List -->
        <main id="links" class="links" aria-label="Links">
          <ul id="links-list" class="links-list">
            <!-- Populated at runtime from data/profile.json by script.js -->
          </ul>
          <p id="empty-state" class="empty-state" hidden>
            No links available yet. Check back soon.
          </p>
        </main>

      </div><!-- /content-center -->

      <!-- Right Sidebar Ad (shown only on search results, desktop) -->
      <aside class="sidebar sidebar-right" id="sidebar-right" aria-label="Advertisement" hidden>
        <div class="sidebar-ad-slot" id="sidebar-ad-right">
          <div class="ad-label">Ad</div>
          <div class="sidebar-ad-container">
            <ins class="adsbygoogle"
              style="display:block"
              data-ad-client="ca-pub-3043505043619574"

              data-ad-format="vertical"

          </div>
        </div>

    </div><!-- /content-layout -->

    <footer class="footer">
      <p class="footer-updated" id="last-updated"></p>
    </footer>
  </div>

  <noscript>
    <p style="text-align:center; padding:2rem; font-family:sans-serif;">
      This page needs JavaScript enabled to display the latest links.
    </p>
  </noscript>

  <script src="script.js" type="module"></script>
</body>
</html>
