name: Update Linktree data and deploy

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

# Least-privilege by default; elevated where actually needed.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    name: Scrape + commit data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # --no-package-lock prevents npm from creating an untracked
        # package-lock.json in CI, which would otherwise pollute
        # `git status --porcelain` and trick the diff check below into
        # thinking the working tree changed when the scraper produced
        # nothing new.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run scraper
        # Never let a scrape failure fail the whole workflow: the script
        # already leaves previous data untouched on error, and Pages should
        # keep serving the last known-good build. GITHUB_TOKEN authenticates
        # the GitHub user API call so it isn't hit by the 60/hour cap that
        # unauthenticated requests share across all Actions runners.
        #
        # On failure, capture the last 80 lines of output to the GitHub
        # Actions step summary (visible on the run page without
        # downloading logs) so we can diagnose what tripped the scraper
        # — Linktree WAF 406, r.jina.ai 401, timeout, etc. The `|| true`
        # ensures the step still exits 0 so the deploy job can run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm run scrape > /tmp/scrape.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::Scrape failed (exit $rc), keeping previous data/profile.json"
            {
              echo "## Scraper failure log (last 80 lines)"
              echo
              echo '```'
              tail -n 80 /tmp/scrape.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Check for changes
        id: diff
        # Only look at the files we actually commit. Using a path-scoped
        # `git status` means stray untracked files (e.g. a stray
        # package-lock.json, a debug log, a node_modules entry that escaped
        # .gitignore) can no longer flip `changed=true` and then trip
        # `git commit` into "nothing to commit" → exit 1.
        run: |
          if [ -n "$(git status --porcelain -- data/profile.json index.html robots.txt sitemap.xml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json index.html robots.txt sitemap.xml
          # Belt-and-suspenders: if `git add` staged nothing after all
          # (race between the diff check and commit, fsync delay, etc.),
          # skip the commit instead of failing the whole workflow with
          # "nothing to commit, working tree clean".
          if git diff --cached --quiet; then
            echo "No staged changes after `git add`; skipping commit."
            exit 0
          fi
          git commit -m "chore: auto-update Linktree data [skip ci]"
          # If a concurrent run (e.g. scheduled + push trigger) pushed
          # between our checkout and our push, rebase our single auto
          # commit on top of origin/main and retry instead of failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "git push failed (attempt $attempt), rebasing on origin/main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
