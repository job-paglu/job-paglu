name: Update Linktree data and deploy

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

# Least-privilege by default; elevated where actually needed.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    name: Scrape + commit data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # --no-package-lock prevents npm from creating an untracked
        # package-lock.json in CI, which would otherwise pollute
        # `git status --porcelain` and trick the diff check below into
        # thinking the working tree changed when the scraper produced
        # nothing new.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run scraper
        # Never let a scrape failure fail the whole workflow: the script
        # already leaves previous data untouched on error, and Pages should
        # keep serving the last known-good build. GITHUB_TOKEN authenticates
        # the GitHub user API call so it isn't hit by the 60/hour cap that
        # unauthenticated requests share across all Actions runners.
        #
        # IMPORTANT: we redirect stdout to /tmp/scrape.log but let stderr
        # flow directly to the workflow's own stderr so that ::error:: /
        # ::warning:: annotations emitted by scrape.js are picked up by
        # the Actions runner and shown on the run page (without sign-in).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Capture stdout to a file for the step-summary tail.
          # Stderr flows freely to the workflow log so ::error:: annotations
          # are recognized by the Actions runner.
          npm run scrape 2>&1 | tee /tmp/scrape.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::warning::Scrape failed (exit $rc), keeping previous data/profile.json"
            {
              echo "## Scraper failure log (last 80 lines)"
              echo
              echo '```'
              tail -n 80 /tmp/scrape.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also write to a tracked file so we can read it via git
            # (since we can't access Actions logs without a PAT).
            tail -n 200 /tmp/scrape.log > data/last-scrape-error.log
            echo "Scraper failed at $(date -u +%Y-%m-%dT%H:%M:%SZ), see data/last-scrape-error.log" >&2
          else
            # Scraper succeeded — remove any stale debug file.
            rm -f data/last-scrape-error.log
          fi
          exit 0

      - name: Check for changes
        id: diff
        # Only look at the files we actually commit. Using a path-scoped
        # `git status` means stray untracked files (e.g. a stray
        # package-lock.json, a debug log, a node_modules entry that escaped
        # .gitignore) can no longer flip `changed=true` and then trip
        # `git commit` into "nothing to commit" → exit 1.
        #
        # `data/last-scrape-error.log` is included so that when the scraper
        # fails, the captured log gets committed (and we can read it from
        # the repo, since we don't have Actions log access without a PAT).
        run: |
          if [ -n "$(git status --porcelain -- data/profile.json index.html robots.txt sitemap.xml data/last-scrape-error.log)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage by directory, not by file: naming data/last-scrape-error.log
          # when it doesn't exist (every successful run) makes `git add`
          # fail with "pathspec did not match" and stage nothing at all.
          # -A also stages the log's deletion once the scraper recovers.
          git add -A -- data index.html robots.txt sitemap.xml
          # Belt-and-suspenders: if `git add` staged nothing after all
          # (race between the diff check and commit, fsync delay, etc.),
          # skip the commit instead of failing the whole workflow with
          # "nothing to commit, working tree clean".
          if git diff --cached --quiet; then
            echo "No staged changes after `git add`; skipping commit."
            exit 0
          fi
          # If only the error log changed (i.e. scraper failed but produced
          # a new error log), label the commit accordingly.
          if git diff --cached --name-only | grep -q '^data/profile.json$'; then
            msg="chore: auto-update Linktree data [skip ci]"
          else
            msg="chore: scraper failed, see data/last-scrape-error.log [skip ci]"
          fi
          git commit -m "$msg"
          # If a concurrent run (e.g. scheduled + push trigger) pushed
          # between our checkout and our push, rebase our single auto
          # commit on top of origin/main and retry instead of failing.
          push_status="undetermined"
          for attempt in 1 2 3; do
            if git push 2>push_err.log; then
              push_status="succeeded-attempt-$attempt"
              break
            fi
            push_status="failed-attempt-$attempt"
            echo "git push failed (attempt $attempt), rebasing on origin/main..."
            cat push_err.log
            git fetch origin main
            if ! git rebase origin/main 2>rebase_err.log; then
              push_status="rebase-conflict-attempt-$attempt"
              cat rebase_err.log
              # Abort the rebase so subsequent attempts have a clean slate.
              git rebase --abort 2>/dev/null || true
              # If our auto-update commit conflicts with origin's, just
              # drop ours — origin's version is fresher by definition.
              git reset --hard origin/main
              # Re-apply the file changes (the scraper's output) on top.
              # But if the scraper succeeded, the freshest data is
              # already in origin; we just need to exit gracefully.
              break
            fi
          done
          echo "push_status=$push_status" >> "$GITHUB_OUTPUT"
          # Don't fail the workflow on push race — the next scheduled
          # run will pick up the data anyway.
          exit 0

  deploy:
    name: Deploy to GitHub Pages
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
